spring:
  application:
    name: NotesApplication
  profiles:
    active: jpa
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1
    username: mkomarov
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true